<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Molnovi — Candidate Review</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2230;
      --border: #30363d;
      --border-soft: #21262d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --text-faint: #6e7681;
      --accent: #58a6ff;
      --pass: #3fb950;
      --fail: #f85149;
      --warn: #d29922;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.45;
      overflow: hidden;
    }

    /* ---------- Layout ---------------------------------------------- */
    #app {
      display: grid;
      grid-template-rows: 64px 1fr;
      height: 100vh;
    }
    header.summary {
      display: grid;
      grid-template-columns: auto auto 1fr repeat(4, 180px);
      align-items: center;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .backends {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 8px 16px;
      height: 100%;
    }
    .backends .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-faint);
      margin-right: 6px;
    }
    .pill {
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.08s;
      letter-spacing: 0.4px;
    }
    .pill:hover { color: var(--text); border-color: var(--text-faint); }
    .pill.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.08);
      font-weight: 600;
    }
    .gen-desc {
      padding: 8px 12px;
      background: var(--panel-2);
      border-left: 2px solid var(--accent);
      margin-bottom: 12px;
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .gen-desc b { color: var(--text); font-family: var(--mono); }
    header.summary > * { background: var(--panel); padding: 10px 18px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    header.summary .brand {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: var(--accent);
    }
    header.summary .brand .sub {
      color: var(--text-faint);
      font-weight: 400;
      font-size: 11px;
      margin-top: 2px;
    }
    header.summary .target {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
    }
    header.summary .target b { color: var(--text); font-weight: 600; }
    header.summary .stat .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-faint);
    }
    header.summary .stat .value {
      font-family: var(--mono);
      font-size: 22px;
      color: var(--text);
      font-weight: 500;
      margin-top: 2px;
    }
    header.summary .stat .sub { font-size: 11px; color: var(--text-dim); }

    main {
      display: grid;
      grid-template-columns: 240px 1fr 420px;
      min-height: 0;
    }

    /* ---------- Sidebar --------------------------------------------- */
    aside.filters {
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 18px 16px;
    }
    aside.filters h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-faint);
      margin: 0 0 8px 0;
      font-weight: 600;
    }
    aside.filters .group { margin-bottom: 22px; }
    aside.filters label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
      font-family: var(--mono);
    }
    aside.filters .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    aside.filters input[type="range"] { flex: 1; accent-color: var(--accent); }
    aside.filters input[type="number"] {
      width: 64px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 6px;
      font-family: var(--mono);
      font-size: 11px;
      border-radius: 2px;
    }
    aside.filters select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 6px;
      font-family: var(--mono);
      font-size: 11px;
      width: 100%;
      border-radius: 2px;
    }
    aside.filters .reset {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      border-radius: 2px;
    }
    aside.filters .reset:hover { color: var(--text); border-color: var(--accent); }

    /* ---------- Table ---------------------------------------------- */
    section.table-wrap {
      overflow-y: auto;
      background: var(--bg);
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }
    thead {
      position: sticky;
      top: 0;
      background: var(--panel);
      z-index: 2;
    }
    thead th {
      text-align: left;
      padding: 10px 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-faint);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    thead th.sortable:hover { color: var(--text); }
    thead th .sort-arrow { color: var(--accent); margin-left: 4px; }
    tbody tr {
      cursor: pointer;
      border-bottom: 1px solid var(--border-soft);
      transition: background 0.06s;
    }
    tbody tr:hover { background: var(--panel); }
    tbody tr.selected { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
    tbody td {
      padding: 8px 12px;
      vertical-align: middle;
    }
    tbody td.id { font-family: var(--mono); color: var(--text-dim); font-size: 11px; }
    tbody td.struct { width: 160px; padding: 4px; }
    tbody td.struct svg { display: block; background: #f3f5f9; border-radius: 3px; max-width: 150px; height: auto; }
    tbody td.num { font-family: var(--mono); text-align: right; }
    tbody td.num.dock { color: var(--accent); font-weight: 500; }
    tbody td.flags { white-space: nowrap; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-family: var(--mono);
      font-size: 10px;
      border-radius: 2px;
      margin-right: 3px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .badge.pass { background: rgba(63, 185, 80, 0.15); color: var(--pass); border: 1px solid rgba(63, 185, 80, 0.4); }
    .badge.fail { background: rgba(248, 81, 73, 0.15); color: var(--fail); border: 1px solid rgba(248, 81, 73, 0.4); }
    .badge.unk  { background: rgba(110, 118, 129, 0.15); color: var(--text-faint); border: 1px solid rgba(110, 118, 129, 0.3); }
    .synth-yes { color: var(--pass); font-family: var(--mono); font-size: 12px; font-weight: 500; }
    .synth-no  { color: var(--fail); font-family: var(--mono); font-size: 14px; }
    .synth-na  { color: var(--text-faint); font-family: var(--mono); font-size: 11px; }
    .rank { color: var(--text-faint); font-family: var(--mono); }

    /* ---------- Detail panel --------------------------------------- */
    aside.detail {
      border-left: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 18px 18px 32px;
    }
    aside.detail .empty {
      color: var(--text-faint);
      text-align: center;
      padding-top: 80px;
      font-size: 12px;
    }
    aside.detail h2 {
      font-family: var(--mono);
      font-size: 14px;
      margin: 0 0 6px 0;
      color: var(--text);
    }
    aside.detail .subhead {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-faint);
      margin-bottom: 14px;
      word-break: break-all;
    }
    aside.detail .section { margin-bottom: 22px; }
    aside.detail .section h4 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-faint);
      margin: 0 0 8px 0;
      font-weight: 600;
      border-bottom: 1px solid var(--border-soft);
      padding-bottom: 4px;
    }
    .struct-large { background: #f3f5f9; border-radius: 4px; padding: 6px; margin-bottom: 6px; text-align: center; }
    .struct-large svg { max-width: 100%; height: auto; }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-family: var(--mono); font-size: 11px; }
    .kv .k { color: var(--text-dim); }
    .kv .v { color: var(--text); text-align: right; }
    .admet-grid { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px; font-family: var(--mono); font-size: 11px; align-items: center; }
    .admet-grid .name { color: var(--text-dim); }
    .admet-grid .val { color: var(--text); text-align: right; }

    /* ---------- Synthesis tree ------------------------------------- */
    .tree { font-family: var(--mono); font-size: 11px; }
    .tree .node { padding: 4px 0; }
    .tree .node.mol .smi { color: var(--text); word-break: break-all; }
    .tree .node.mol.in-stock .smi { color: var(--pass); }
    .tree .node.mol .badge { vertical-align: middle; }
    .tree .node.reaction { color: var(--text-faint); font-style: italic; padding-left: 14px; border-left: 1px dashed var(--border); margin-left: 6px; }
    .tree .children { margin-left: 14px; padding-left: 6px; border-left: 1px solid var(--border-soft); }
    .tree .struct-mini { display: inline-block; vertical-align: middle; background: #f3f5f9; border-radius: 2px; margin-right: 6px; }
    .tree .struct-mini svg { display: block; width: 100px; height: 70px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
  </style>
</head>
<body>
<div id="app">
  <header class="summary">
    <div class="brand">
      MOLNOVI
      <div class="sub">candidate review · v0.1</div>
    </div>
    <div class="backends" id="backend-pills"></div>
    <div class="target" id="target-info"></div>
    <div class="stat"><div class="label">Generated</div><div class="value" id="stat-generated">—</div></div>
    <div class="stat"><div class="label">Passed Screening</div><div class="value" id="stat-screening">—</div><div class="sub" id="stat-screening-pct"></div></div>
    <div class="stat"><div class="label">Synthesis Routes</div><div class="value" id="stat-synth">—</div><div class="sub" id="stat-synth-sub"></div></div>
    <div class="stat"><div class="label">Best Docking</div><div class="value" id="stat-best">—</div><div class="sub">kcal/mol</div></div>
  </header>

  <main>
    <aside class="filters">
      <div class="gen-desc" id="gen-desc"></div>
      <div class="group">
        <h3>Drug-likeness</h3>
        <label>Min QED <span class="v" id="qed-val" style="float:right;color:var(--text)">0.00</span></label>
        <div class="row"><input type="range" id="qed-min" min="0" max="1" step="0.01" value="0" /></div>

        <label>Max Docking (kcal/mol)<span class="v" id="dock-val" style="float:right;color:var(--text)">0.00</span></label>
        <div class="row"><input type="range" id="dock-max" min="-15" max="0" step="0.05" value="0" /></div>

        <label>Max SA Score<span class="v" id="sa-val" style="float:right;color:var(--text)">10.0</span></label>
        <div class="row"><input type="range" id="sa-max" min="1" max="10" step="0.1" value="10" /></div>
      </div>

      <div class="group">
        <h3>ADMET</h3>
        <label>hERG</label>
        <select id="herg"><option value="any">Any</option><option value="pass">Pass</option><option value="fail">Fail</option></select>
        <label style="margin-top:8px">AMES</label>
        <select id="ames"><option value="any">Any</option><option value="pass">Pass</option><option value="fail">Fail</option></select>
        <label style="margin-top:8px">DILI</label>
        <select id="dili"><option value="any">Any</option><option value="pass">Pass</option><option value="fail">Fail</option></select>
      </div>

      <div class="group">
        <h3>Synthesis</h3>
        <select id="synth">
          <option value="any">Any</option>
          <option value="found">Route found</option>
          <option value="not-found">No route</option>
          <option value="evaluated">Evaluated only</option>
        </select>
      </div>

      <div class="group">
        <h3>Screening</h3>
        <select id="screen">
          <option value="any">Any</option>
          <option value="pass">Passed</option>
          <option value="fail">Rejected</option>
        </select>
      </div>

      <button class="reset" id="reset-btn">Reset filters</button>
      <div style="margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--text-faint)" id="filter-count"></div>
    </aside>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="final_rank" class="sortable">#</th>
            <th>Structure</th>
            <th data-sort="molecule_id" class="sortable">ID</th>
            <th data-sort="composite_score" class="sortable">Composite</th>
            <th data-sort="docking_score" class="sortable">Docking</th>
            <th data-sort="qed" class="sortable">QED</th>
            <th data-sort="sa_score" class="sortable">SA</th>
            <th>ADMET (hERG · AMES · DILI)</th>
            <th>Synth</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <aside class="detail" id="detail">
      <div class="empty">Select a molecule to inspect.</div>
    </aside>
  </main>
</div>

<script src="professor_demo.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const data = window.PROFESSOR_DEMO_DATA;
  if (!data) {
    document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#f85149">'
      + 'Could not load <code>professor_demo.js</code>. Run the assembly script and refresh.'
      + '</div>';
    return;
  }

  // ---- Multi-backend support -------------------------------------------
  // Schema: data.backends = { name: {summary, molecules, ...} }; data.backend_order
  // gives the display order; data.default_backend names the initially active one.
  const backendOrder = data.backend_order || Object.keys(data.backends || {});
  const generatorDescriptions = data.generator_descriptions || {};

  // ---- Target line + brand --------------------------------------------
  const t = data.target || {};
  $('target-info').innerHTML = `Target: <b>${t.pdb || ''}</b> · ${t.name || ''} · ${t.disease || ''} · known drug: <b>${t.known_drug || '—'}</b>`;

  // ---- State ------------------------------------------------------------
  const state = {
    activeBackend: data.default_backend || backendOrder[0],
    sortKey: 'composite_score',
    sortDir: 'desc',
    selectedId: null,
    filters: {
      qedMin: 0, dockMax: 0, saMax: 10,
      herg: 'any', ames: 'any', dili: 'any',
      synth: 'any', screen: 'any',
    }
  };

  function currentDataset() {
    return (data.backends || {})[state.activeBackend] || { molecules: [], summary: {} };
  }

  function renderSummary() {
    const s = currentDataset().summary || {};
    $('stat-generated').textContent = s.total_generated ?? '—';
    $('stat-screening').textContent = s.passed_screening ?? '—';
    if (s.total_generated) {
      const pct = ((s.passed_screening / s.total_generated) * 100).toFixed(0);
      $('stat-screening-pct').textContent = pct + '% survival';
    } else {
      $('stat-screening-pct').textContent = '';
    }
    $('stat-synth').textContent = `${s.synthesis_routes_found ?? 0} / ${s.synthesis_evaluated ?? 0}`;
    $('stat-synth-sub').textContent = 'AiZynthFinder';
    $('stat-best').textContent = s.best_docking_score != null ? s.best_docking_score.toFixed(2) : '—';
  }

  function renderBackendPills() {
    const s = (b) => (data.backends[b].summary || {});
    $('backend-pills').innerHTML = '<span class="label">Generator</span>' + backendOrder.map(b => {
      const summary = s(b);
      const n = summary.total_generated ?? 0;
      const cls = b === state.activeBackend ? 'pill active' : 'pill';
      return `<button class="${cls}" data-backend="${b}">${b.toUpperCase()} <span style="opacity:0.6">${n}</span></button>`;
    }).join('');
    document.querySelectorAll('#backend-pills .pill').forEach(btn => {
      btn.addEventListener('click', () => setActiveBackend(btn.dataset.backend));
    });
  }

  function renderGeneratorDescription() {
    const desc = generatorDescriptions[state.activeBackend] || '';
    if (!desc) { $('gen-desc').style.display = 'none'; return; }
    $('gen-desc').style.display = 'block';
    $('gen-desc').innerHTML = `<b>${state.activeBackend.toUpperCase()}</b>: ${desc}`;
  }

  function setActiveBackend(name) {
    if (!data.backends[name]) return;
    state.activeBackend = name;
    state.selectedId = null;
    renderBackendPills();
    renderGeneratorDescription();
    renderSummary();
    renderRows();
    renderDetail(null);
  }

  function valueOf(m, k) {
    if (k === 'qed') return m.properties.qed ?? -Infinity;
    if (k === 'sa_score') return m.properties.sa_score ?? Infinity;
    if (k === 'docking_score') return m.docking_score ?? Infinity;
    return m[k];
  }

  function passesFilters(m) {
    const f = state.filters;
    const qed = m.properties.qed;
    const dock = m.docking_score;
    const sa = m.properties.sa_score;
    if (qed != null && qed < f.qedMin) return false;
    if (dock != null && dock > f.dockMax) return false;   // dockMax = upper bound on the (negative) score
    if (sa != null && sa > f.saMax) return false;
    for (const k of ['herg', 'ames', 'dili']) {
      const want = f[k];
      if (want === 'any') continue;
      const flag = m.admet_flags[k.toUpperCase().replace('HERG','hERG')];
      if (want === 'pass' && flag !== true) return false;
      if (want === 'fail' && flag !== false) return false;
    }
    if (f.synth !== 'any') {
      const sy = m.synthesis;
      if (f.synth === 'found' && !(sy.evaluated && sy.route_found)) return false;
      if (f.synth === 'not-found' && !(sy.evaluated && !sy.route_found)) return false;
      if (f.synth === 'evaluated' && !sy.evaluated) return false;
    }
    if (f.screen === 'pass' && !m.screening_passed) return false;
    if (f.screen === 'fail' && m.screening_passed) return false;
    return true;
  }

  function flagBadge(name, flag) {
    const cls = flag === true ? 'pass' : flag === false ? 'fail' : 'unk';
    const txt = flag === true ? '✓' : flag === false ? '✗' : '?';
    return `<span class="badge ${cls}" title="${name}">${name} ${txt}</span>`;
  }

  function renderRows() {
    const molecules = currentDataset().molecules || [];
    const filtered = molecules.filter(passesFilters);
    const dir = state.sortDir === 'asc' ? 1 : -1;
    filtered.sort((a, b) => {
      const av = valueOf(a, state.sortKey);
      const bv = valueOf(b, state.sortKey);
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });

    const html = filtered.map(m => {
      const sy = m.synthesis;
      let synthCell;
      if (!sy.evaluated) synthCell = `<span class="synth-na">n/a</span>`;
      else if (sy.route_found) synthCell = `<span class="synth-yes">✓ ${sy.n_steps}step</span>`;
      else synthCell = `<span class="synth-no">✗</span>`;
      return `
        <tr data-id="${m.molecule_id}" class="${m.molecule_id === state.selectedId ? 'selected' : ''}">
          <td class="rank">${m.final_rank}</td>
          <td class="struct">${m.svg || ''}</td>
          <td class="id">${m.molecule_id}</td>
          <td class="num">${(m.composite_score ?? 0).toFixed(2)}</td>
          <td class="num dock">${m.docking_score != null ? m.docking_score.toFixed(2) : '—'}</td>
          <td class="num">${m.properties.qed != null ? m.properties.qed.toFixed(3) : '—'}</td>
          <td class="num">${m.properties.sa_score != null ? m.properties.sa_score.toFixed(2) : '—'}</td>
          <td class="flags">
            ${flagBadge('hERG', m.admet_flags.hERG)}
            ${flagBadge('AMES', m.admet_flags.AMES)}
            ${flagBadge('DILI', m.admet_flags.DILI)}
          </td>
          <td>${synthCell}</td>
        </tr>`;
    }).join('');

    $('rows').innerHTML = html;
    $('filter-count').textContent = `${filtered.length} of ${molecules.length} shown`;

    document.querySelectorAll('thead th.sortable').forEach(th => {
      th.querySelector('.sort-arrow')?.remove();
      if (th.dataset.sort === state.sortKey) {
        const arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.textContent = state.sortDir === 'asc' ? '▲' : '▼';
        th.appendChild(arrow);
      }
    });

    document.querySelectorAll('tbody tr').forEach(tr => {
      tr.addEventListener('click', () => {
        state.selectedId = tr.dataset.id;
        renderRows();
        renderDetail(molecules.find(x => x.molecule_id === state.selectedId));
      });
    });
  }

  // ---- Detail panel ----------------------------------------------------
  function fmt(v, digits = 3) {
    if (v == null) return '—';
    if (typeof v === 'number') return v.toFixed(digits);
    return String(v);
  }

  function admetRow(label, val, flag) {
    const badge = flag == null ? '' : flagBadge(label, flag);
    return `<div class="name">${label}</div><div class="val">${fmt(val, 3)}</div><div>${badge}</div>`;
  }

  function renderTreeNode(node, depth = 0) {
    if (!node) return '';
    if (node.type === 'mol') {
      const stockBadge = node.in_stock
        ? '<span class="badge pass">IN STOCK</span>'
        : '<span class="badge fail">SYNTHESIZE</span>';
      const struct = node.svg
        ? `<span class="struct-mini">${node.svg}</span>`
        : '';
      const childHtml = (node.children || []).map(c => renderTreeNode(c, depth + 1)).join('');
      return `
        <div class="node mol ${node.in_stock ? 'in-stock' : ''}">
          ${struct}
          <span class="smi">${node.smiles || '?'}</span>
          ${stockBadge}
          ${childHtml ? `<div class="children">${childHtml}</div>` : ''}
        </div>`;
    }
    if (node.type === 'reaction') {
      const childHtml = (node.children || []).map(c => renderTreeNode(c, depth + 1)).join('');
      return `<div class="node reaction">↳ reaction${childHtml ? `<div class="children">${childHtml}</div>` : ''}</div>`;
    }
    return '';
  }

  function renderDetail(m) {
    if (!m) { $('detail').innerHTML = '<div class="empty">Select a molecule to inspect.</div>'; return; }

    const props = m.properties;
    const a = m.admet, f = m.admet_flags;
    const sy = m.synthesis;

    let synthSection = '';
    if (!sy.evaluated) {
      synthSection = `
        <div class="section">
          <h4>Synthesis (AiZynthFinder)</h4>
          <div style="font-size:11px;color:var(--text-faint);font-family:var(--mono)">Not evaluated. Only the top 10 by docking are routed.</div>
        </div>`;
    } else {
      const status = sy.route_found
        ? `<span class="badge pass">ROUTE FOUND · ${sy.n_steps} steps · ${sy.n_routes} alts</span>`
        : `<span class="badge fail">NO ROUTE</span>`;
      let treeHtml = '';
      if (sy.route_found && sy.route_tree) {
        treeHtml = `<div class="tree">${renderTreeNode(sy.route_tree)}</div>`;
      } else if (sy.error) {
        treeHtml = `<div style="font-size:11px;color:var(--fail);font-family:var(--mono)">${sy.error}</div>`;
      }
      let precHtml = '';
      if (sy.precursors && sy.precursors.length) {
        precHtml = `
          <h4 style="margin-top:14px">Purchasable precursors (${sy.precursors.length})</h4>
          <div style="font-family:var(--mono);font-size:11px;color:var(--text);word-break:break-all">
            ${sy.precursors.map(p => `<div style="padding:3px 0;border-bottom:1px dashed var(--border-soft)">${p}</div>`).join('')}
          </div>`;
      }
      synthSection = `
        <div class="section">
          <h4>Synthesis (AiZynthFinder)</h4>
          ${status}
          ${precHtml}
          ${treeHtml ? `<h4 style="margin-top:14px">Reaction tree</h4>${treeHtml}` : ''}
        </div>`;
    }

    $('detail').innerHTML = `
      <h2>${m.molecule_id}</h2>
      <div class="subhead">${m.smiles}</div>
      <div class="struct-large">${m.svg || ''}</div>

      <div class="section">
        <h4>Composite & Docking</h4>
        <div class="kv">
          <div class="k">Final rank</div><div class="v">#${m.final_rank}</div>
          <div class="k">Composite score</div><div class="v">${fmt(m.composite_score, 3)}</div>
          <div class="k">Docking affinity (kcal/mol)</div><div class="v">${fmt(m.docking_score, 2)}</div>
          <div class="k">Screening status</div><div class="v">${m.screening_passed ? '<span class="badge pass">passed</span>' : '<span class="badge fail">rejected</span>'}</div>
        </div>
      </div>

      <div class="section">
        <h4>Drug-likeness</h4>
        <div class="kv">
          <div class="k">Mol weight</div><div class="v">${fmt(props.mol_weight, 1)} Da</div>
          <div class="k">LogP</div><div class="v">${fmt(props.logp, 2)}</div>
          <div class="k">QED</div><div class="v">${fmt(props.qed, 3)}</div>
          <div class="k">SA score</div><div class="v">${fmt(props.sa_score, 2)}</div>
          <div class="k">TPSA</div><div class="v">${fmt(props.tpsa, 1)} Å²</div>
          <div class="k">H-bond donors / acceptors</div><div class="v">${props.hbd} / ${props.hba}</div>
          <div class="k">Heavy atoms</div><div class="v">${props.heavy_atoms}</div>
          <div class="k">Rotatable bonds</div><div class="v">${props.rotatable_bonds}</div>
          <div class="k">PAINS alerts</div><div class="v">${props.pains_alerts}</div>
        </div>
      </div>

      <div class="section">
        <h4>ADMET (ADMET-AI, 11 endpoints shown)</h4>
        <div class="admet-grid">
          ${admetRow('hERG', a.hERG, f.hERG)}
          ${admetRow('AMES', a.AMES, f.AMES)}
          ${admetRow('DILI', a.DILI, f.DILI)}
          ${admetRow('CYP2D6', a.CYP2D6)}
          ${admetRow('CYP3A4', a.CYP3A4)}
          ${admetRow('Caco2', a.Caco2)}
          ${admetRow('HIA', a.HIA)}
          ${admetRow('BBB', a.BBB)}
          ${admetRow('Clearance', a.Clearance)}
          ${admetRow('Bioavailability', a.Bioavailability)}
          ${admetRow('LD50', a.LD50)}
        </div>
      </div>

      ${synthSection}
    `;
  }

  // ---- Wire up filter controls -----------------------------------------
  function bindRange(id, key, label, fn) {
    const el = $(id);
    el.addEventListener('input', () => {
      state.filters[key] = parseFloat(el.value);
      $(label).textContent = fn ? fn(el.value) : el.value;
      renderRows();
    });
  }
  // Set initial dock-max bound based on the union of all backends, so the
  // slider range stays stable as the user toggles between generators.
  const dockEl = $('dock-max');
  const allDockingScores = backendOrder.flatMap(b =>
    (data.backends[b].molecules || []).map(m => m.docking_score ?? 0)
  );
  const dockMin = Math.floor(Math.min(0, ...allDockingScores) - 1);
  dockEl.min = dockMin;
  dockEl.value = 0;
  state.filters.dockMax = 0;
  $('dock-val').textContent = '0.00';

  bindRange('qed-min', 'qedMin', 'qed-val', v => parseFloat(v).toFixed(2));
  bindRange('dock-max', 'dockMax', 'dock-val', v => parseFloat(v).toFixed(2));
  bindRange('sa-max', 'saMax', 'sa-val', v => parseFloat(v).toFixed(1));

  ['herg','ames','dili','synth','screen'].forEach(id => {
    $(id).addEventListener('change', () => {
      state.filters[id] = $(id).value;
      renderRows();
    });
  });

  $('reset-btn').addEventListener('click', () => {
    state.filters = { qedMin: 0, dockMax: 0, saMax: 10, herg: 'any', ames: 'any', dili: 'any', synth: 'any', screen: 'any' };
    $('qed-min').value = 0; $('qed-val').textContent = '0.00';
    $('dock-max').value = 0; $('dock-val').textContent = '0.00';
    $('sa-max').value = 10; $('sa-val').textContent = '10.0';
    ['herg','ames','dili','synth','screen'].forEach(k => $(k).value = 'any');
    renderRows();
  });

  document.querySelectorAll('thead th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (state.sortKey === k) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = k;
        // Default direction: desc for higher-is-better, asc for lower-is-better
        state.sortDir = (k === 'docking_score' || k === 'sa_score' || k === 'final_rank') ? 'asc' : 'desc';
      }
      renderRows();
    });
  });

  renderBackendPills();
  renderGeneratorDescription();
  renderSummary();
  renderRows();
})();
</script>
</body>
</html>
