# Base / Orchestrator Environment
# Used for all pipeline stages except TargetDiff and Pocket2Mol generation.
# Install: conda env update -n base -f env_orchestrator.yml
#
# Then install pip deps:
#   conda run -n base pip install -r requirements.txt

name: base
# conda-forge ONLY — no `defaults`. Mixing the two channels let the solver
# pair an rdkit C-extension built for one NumPy ABI with a different NumPy,
# so every `import rdkit` crashed with "compiled using NumPy 1.x cannot be
# run in NumPy 2.x". One channel keeps the ABI consistent.
channels:
  - conda-forge
dependencies:
  # Pinned to 3.11, not ">=3.10": the pip deps below (notably pytdc) have no
  # 3.12/3.13 wheels, and an unpinned base env resolves to the newest Python,
  # forcing a from-source NumPy build. 3.11 keeps everything on prebuilt wheels.
  - python=3.11
  # NumPy pinned to 1.x: rdkit/scipy/pandas C-extensions in this env must all
  # share one NumPy ABI. Unpinned, the build resolved an rdkit compiled for
  # NumPy 1.x alongside NumPy 2.x and the pipeline crashed on import. Pinning
  # numpy<2 makes conda-forge select the matching numpy-1.x rdkit build.
  - numpy<2
  - rdkit
  - vina
  - openjdk=17          # Required for P2Rank pocket detection
  - pandas
  - scipy
  - pyyaml
  - pytest          # test suite (make test / CI)
  - pip
  - pip:
    # CPU-only PyTorch. admet-ai (and molscore) otherwise pull the default
    # CUDA build of torch, which drags in multi-GB nvidia-cu* runtime wheels
    # that this env never uses — every stage that runs in `base` is CPU-only.
    # The +cpu local-version tag outranks PyPI's CUDA wheel, so pip picks it;
    # this both fixes the CI disk overrun and slims the published image.
    - --extra-index-url https://download.pytorch.org/whl/cpu
    # Hold NumPy on the conda-installed 1.x build — stop pip from upgrading it
    # past the rdkit ABI while resolving torch/admet-ai/molscore.
    - "numpy<2"
    - torch
    - molscore>=0.3
    - admet-ai>=1.0
    # Pinned to 0.5.0, NOT >=0.5. Meeko 0.6+ rewrote molsetup to call
    # `mol.HasQuery()`, a method this env's RDKit (2022.09.5, held back by the
    # numpy<2 ABI pin) does not expose on Mol — so `prepare()` aborts every
    # ligand with "'Mol' object has no attribute 'HasQuery'". 0.5.0 is the last
    # release compatible with this RDKit, and matches run_docking.py's API
    # (preparator.prepare() + preparator.setup). Bump only alongside RDKit.
    - meeko==0.5.0
    - gemmi>=0.6
    - pytdc>=0.4
