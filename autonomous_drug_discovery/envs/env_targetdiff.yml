# TargetDiff Environment — cloud / Ampere variant (PyTorch 1.13 / CUDA 11.7).
#
# This is the env baked into the Docker image and used on RunPod's Ampere GPUs.
# It does NOT run on NVIDIA Blackwell (RTX 50-series, sm_120) — for a local
# Blackwell GPU use env_targetdiff_blackwell.yml instead. Both install under
# the same conda env name, `targetdiff_env`; only the file differs, per machine.
# See docs/pipeline-guide.md -> "Full pipeline, local GPU".
#
# The torch + PyG stack is pip-only and DELIBERATELY PINNED, mirroring
# env_targetdiff_blackwell.yml. The previous version left `pyg`,
# `pytorch-cluster/scatter/sparse` unpinned on the conda `pyg` channel; a fresh
# image rebuild then re-solved them to newer builds whose compiled .so files
# expect a `libc10_cuda.so` the resolved torch didn't provide — every TargetDiff
# import crashed with "OSError: libc10_cuda.so: cannot open shared object file"
# (cloud batch 26663134404, 2026-05-29). Pinning to the prebuilt cu117 wheels
# from data.pyg.org makes the build reproducible and brings the matching CUDA
# torch, so `torch.cuda.is_available()` is True on a GPU pod (so `--device auto`
# resolves to cuda, not cpu).

name: targetdiff_env
channels:
  - conda-forge
dependencies:
  - python=3.8
  # Pin a modern C++ runtime: conda-forge rdkit pulls boost 1.84, whose
  # libboost_serialization needs GLIBCXX_3.4.31. The Ubuntu 22.04 base image's
  # system libstdc++ tops out at 3.4.30, so without a recent libstdcxx-ng in the
  # env, `import rdkit` in this env dies with "GLIBCXX_3.4.31 not found"
  # (cloud batch 26680339214). >=13.2 provides 3.4.31.
  - libstdcxx-ng>=13.2
  - libgcc-ng>=13.2
  - openbabel
  - rdkit
  - biopython
  - scipy
  - pandas
  - pyyaml
  - tqdm
  # lmdb from conda-forge (NOT pip): the pip wheel falls back to a cffi backend
  # that JIT-compiles a C module via gcc at first import, which fails in the
  # cu117/py38 image (missing lmdb headers) — cloud batch 26667598702. The
  # conda-forge `python-lmdb` package ships a prebuilt binding + bundled
  # liblmdb, so no compiler is touched at runtime.
  - python-lmdb
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu117
    - --find-links https://data.pyg.org/whl/torch-1.13.0+cu117.html
    - torch==1.13.0+cu117
    - torch-scatter==2.1.1+pt113cu117
    - torch-cluster==1.6.1+pt113cu117
    - torch-sparse==0.6.17+pt113cu117
    - torch-geometric==2.3.1
    - easydict
