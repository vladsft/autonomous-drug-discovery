# Builds the Agent Harness image, tests inside it, and publishes to GHCR.
#
# On a pull request: lint + build + test (no publish).
# On a push to main: the above, then push `:latest` and `:<sha>` to GHCR —
# so "what's tagged :latest" always equals "what's on main".

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Opt into Node.js 24 for JS actions ahead of the June-2026 forced switch.
  # The published @v4/@v5 tags of our pinned actions still ship Node 20 binaries;
  # this flag tells the runner to execute them under Node 24 instead, silencing
  # the deprecation warning without changing action versions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Fail only on real errors (syntax, undefined names) — not style — so a
      # fresh linter on a legacy codebase doesn't wall off the pipeline.
      # Vendored submodules are third-party code; not ours to lint.
      - name: ruff check
        run: |
          ruff check --select E9,F63,F7,F82 \
            --exclude autonomous_drug_discovery/modules/02_generation/targetdiff \
            --exclude autonomous_drug_discovery/modules/02_generation/pocket2mol \
            --exclude data \
            .

  build:
    runs-on: ubuntu-latest
    needs: lint
    # Image build is ~24 min on a cold runner; 60 min leaves headroom for a
    # slow mamba solve without burning the free-tier 6h job ceiling on a hang.
    timeout-minutes: 60
    steps:
      # The image bundles a CUDA base + two conda envs + weights. Current
      # GitHub runners have a single ~72 GB OS disk — no separate /mnt volume
      # (an earlier fix moved Docker's data-root to /mnt, which silently put
      # it right back on /). So instead: reclaim every preinstalled toolchain
      # the build doesn't use. The image size itself is kept down by the
      # CPU-only torch pin in env_orchestrator.yml.
      - name: Free up runner disk
        run: |
          echo "--- disk before ---"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache \
                      /usr/local/lib/node_modules /opt/microsoft /opt/az \
                      /usr/lib/google-cloud-sdk /usr/share/miniconda \
                      /usr/local/share/powershell /usr/local/share/chromium
          sudo apt-get clean
          sudo docker image prune -af
          echo "--- disk after reclaim ---"; df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load into the runner's daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          # No GHA cache: exporting a cache copy of a multi-GB image next to
          # the image itself overran the runner's single disk. Re-add later
          # via registry cache once there is headroom to spare.

      - name: Entrypoint smoke — bash branch
        # The entrypoint's `bash|sh` case is easy to break and silently regresses
        # interactive shells (`docker run --rm <image> bash -lc '…'`). One-line
        # check that the branch still routes through `conda run -n base`.
        run: |
          out="$(docker run --rm ${{ env.IMAGE }}:ci bash -lc 'echo entrypoint-ok')"
          test "${out}" = "entrypoint-ok" || { echo "entrypoint regression: got '${out}'"; exit 1; }

      - name: Test inside the image
        run: |
          docker run --rm ${{ env.IMAGE }}:ci \
            bash -lc 'cd /app && conda run --no-capture-output -n base \
              python -m pytest -q autonomous_drug_discovery/tests'

      # data/ is not baked into the image — mount the checked-out repo's copy,
      # exactly as `make run` does. simulation mode still runs real P2Rank
      # pocket detection on 1M17, so this exercises Stage 1 for real.
      - name: Smoke test — full pipeline in simulation mode
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/autonomous_drug_discovery/data:/app/autonomous_drug_discovery/data \
            ${{ env.IMAGE }}:ci \
            orchestrator.py run data/processed/1M17.pdb --mode simulation

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE }}:ci ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:ci ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}

  # CPU-only slim image (~3 GB) for the rdkit/simulation modes. Built on its own
  # runner so the two multi-GB builds don't contend for the single ~72 GB disk.
  # Tags: :slim and :slim-<sha>. batch.yml points rdkit/simulation pods here so
  # a cold machine pulls it in minutes instead of timing out on the 10 GB image.
  build-slim:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache \
                      /usr/local/lib/node_modules /opt/microsoft /opt/az \
                      /usr/lib/google-cloud-sdk /usr/share/miniconda \
                      /usr/local/share/powershell /usr/local/share/chromium
          sudo apt-get clean
          sudo docker image prune -af

      # No submodules: the slim image excludes the TargetDiff path entirely.
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build slim image (load into the runner's daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slim
          load: true
          tags: ${{ env.IMAGE }}:slim-ci

      - name: Entrypoint smoke — bash branch
        run: |
          out="$(docker run --rm ${{ env.IMAGE }}:slim-ci bash -lc 'echo entrypoint-ok')"
          test "${out}" = "entrypoint-ok" || { echo "entrypoint regression: got '${out}'"; exit 1; }

      # data/ is not baked into the image — mount the checked-out repo's copy.
      # simulation mode runs real P2Rank pocket detection on 1M17 (Stage 1),
      # exercising the slim image's base env end to end without a GPU.
      - name: Smoke test — full pipeline in simulation mode
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/autonomous_drug_discovery/data:/app/autonomous_drug_discovery/data \
            ${{ env.IMAGE }}:slim-ci \
            orchestrator.py run data/processed/1M17.pdb --mode simulation

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push slim to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE }}:slim-ci ${{ env.IMAGE }}:slim
          docker tag ${{ env.IMAGE }}:slim-ci ${{ env.IMAGE }}:slim-${{ github.sha }}
          docker push ${{ env.IMAGE }}:slim
          docker push ${{ env.IMAGE }}:slim-${{ github.sha }}
