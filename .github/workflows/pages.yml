# Publishes the static chemist dashboard to GitHub Pages.
#
# Runs when dashboard/ changes on main (regenerate_dashboard.py rewrites
# dashboard/professor_demo.js, you commit it, this deploys it) — so the
# professor's URL always reflects the latest campaign data.
#
# ONE-TIME MANUAL SETUP (cannot be automated): repo Settings -> Pages ->
# Source = "GitHub Actions". The default GITHUB_TOKEN is not permitted to
# create a Pages site via the API (configure-pages `enablement: true` fails
# with "Resource not accessible by integration"), so the first enablement
# must be a manual admin click. After that, this workflow deploys on its own.

name: pages

on:
  push:
    branches: [main]
    paths: ['dashboard/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # See build.yml for context — opt into Node 24 ahead of the forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Never let two deploys race; the newest commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
