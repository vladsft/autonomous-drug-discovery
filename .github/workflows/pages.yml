# Publishes the static chemist dashboard to GitHub Pages.
#
# Runs when dashboard/ changes on main (regenerate_dashboard.py rewrites
# dashboard/professor_demo.js, you commit it, this deploys it) — so the
# professor's URL always reflects the latest campaign data.
#
# No manual setup needed: `configure-pages` runs with `enablement: true`, so
# it turns Pages on (Source = GitHub Actions) via the API on first run rather
# than failing with "Pages not enabled".

name: pages

on:
  push:
    branches: [main]
    paths: ['dashboard/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # See build.yml for context — opt into Node 24 ahead of the forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Never let two deploys race; the newest commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages (Source = GitHub Actions) via the API on first run,
          # so a fresh repo doesn't need a manual Settings -> Pages click.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
