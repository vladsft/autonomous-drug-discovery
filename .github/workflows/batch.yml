# Phase 1.5 — fire-and-forget batch over a target list.
#
# Trigger: Actions → "batch_cloud_run" → "Run workflow". The form fields
# below become inputs to scripts/batch_cloud_run.py. After the batch drains,
# the action regenerates the multi-target dashboard and commits dashboard/ back
# to main. Publishing to GitHub Pages is currently DISABLED here (Pages isn't
# enabled on the repo); re-enable via the standalone pages.yml workflow once
# Settings → Pages → Source = GitHub Actions is set. See the note near the end.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   RUNPOD_API_KEY            — RunPod console, Settings → API Keys
#   RUNPOD_NETWORK_VOLUME_ID  — RunPod Storage → Network Volume
#   R2_BUCKET                 — Cloudflare R2 bucket name (e.g. agent-harness)
#   R2_ACCESS_KEY_ID          — R2 access key
#   R2_SECRET_ACCESS_KEY      — R2 secret
#   R2_ENDPOINT               — https://<accountid>.r2.cloudflarestorage.com
#
# Optional secret (only for a PRIVATE GHCR image):
#   RUNPOD_CONTAINER_REGISTRY_AUTH_ID
#                             — RunPod → Settings → Container Registry Auth ID
#                               (register a read:packages GitHub PAT there first)
#
# Optional repo variable (Settings → Secrets and variables → Variables):
#   IMAGE                     — defaults to ghcr.io/${{ github.repository }}:latest
#   RUNPOD_GPU_TYPE           — defaults to "NVIDIA GeForce RTX 3090"

name: batch_cloud_run

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'PDB codes (whitespace or comma separated, e.g. "1M17 2HYY 6P3D 8P1L")'
        required: true
        type: string
      mode:
        description: 'Generation backend'
        required: true
        default: targetdiff
        type: choice
        # `cascade` = RDKit (CPU) + TargetDiff (GPU) merged — the recommended
        # mode. The synthesizability gate auto-disables on the pod (no AiZynth
        # in the image / AIZYNTH_CONFIG unset), so the GPU is never held for
        # CPU-only retrosynthesis — that runs off-pod (local/dispatcher). See
        # plan.md "Synthesizability gate" + "Cost-optimal cloud".
        options: [cascade, targetdiff, rdkit, pocket2mol, simulation]
      num_samples:
        description: 'Molecules per target'
        required: true
        default: '30'
        type: string
      parallelism:
        description: 'Concurrent RunPod pods (≤ 10 keeps free-tier credit healthy)'
        required: true
        default: '5'
        type: string
      force:
        description: 'Ignore the 24h idempotency skip-list'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

# A batch run can take hours; ensure only one is in flight at a time per repo.
# `cancel-in-progress: false` because cancelling a running batch would leak
# pods — better to queue.
concurrency:
  group: batch_cloud_run
  cancel-in-progress: false

permissions:
  contents: write    # commit the regenerated dashboard back to main
  packages: read     # batch_cloud_run.py's image preflight queries GHCR via gh api

env:
  # Always the full per-commit image, for every mode. Pinned to the immutable
  # :<sha> tag (never :latest — RunPod caches by tag per machine and would reuse
  # a stale one). The full ~10 GB image is heavy to pull, so the dispatcher's
  # STARTUP_GRACE_S is set generously (40 min) to let a cold machine finish the
  # pull. build.yml pushes :<sha> on every push to main — that build must have
  # finished before dispatching. vars.IMAGE overrides if set (e.g. to debug).
  IMAGE: ${{ vars.IMAGE || format('ghcr.io/{0}:{1}', github.repository, github.sha) }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 5h50m; the free-tier ceiling is 6h.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # we commit to main at the end

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rclone + Python deps
        run: |
          curl -fsSL -o /tmp/rclone.zip \
              https://github.com/rclone/rclone/releases/download/v1.74.1/rclone-v1.74.1-linux-amd64.zip
          unzip -j /tmp/rclone.zip '*/rclone' -d /usr/local/bin/
          chmod +x /usr/local/bin/rclone
          rclone --version
          python -m pip install --upgrade pip
          # batch_cloud_run.py + regenerate_dashboard.py + build_demo_dataset.py.
          pip install requests rdkit-pypi

      - name: Run the batch
        env:
          # `gh` (used by batch_cloud_run.py's image preflight) reads this for auth.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # R2 object tokens can't CreateBucket; skip rclone's precheck so the
          # runner's own R2 writes (and the value passed to pods) succeed.
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          # Volume intentionally NOT passed: attaching it region-locks pods to
          # one datacenter (EU-CZ-1), which is chronically GPU-starved. Running
          # volumeless lets pods land in any datacenter with free GPUs; R2 is
          # the source of truth. Set vars.RUNPOD_NETWORK_VOLUME_ID to re-enable.
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID || '' }}
          RUNPOD_GPU_TYPE: ${{ vars.RUNPOD_GPU_TYPE || 'NVIDIA GeForce RTX 3090' }}
          # Optional — only needed for a private GHCR image. Empty secret is fine.
          RUNPOD_CONTAINER_REGISTRY_AUTH_ID: ${{ secrets.RUNPOD_CONTAINER_REGISTRY_AUTH_ID }}
        run: |
          set -euo pipefail
          force_flag=""
          if [ "${{ inputs.force }}" = "true" ]; then force_flag="--force"; fi
          python scripts/batch_cloud_run.py \
            --targets "${{ inputs.targets }}" \
            --mode "${{ inputs.mode }}" \
            --num-samples ${{ inputs.num_samples }} \
            --parallelism ${{ inputs.parallelism }} \
            ${force_flag}

      - name: Regenerate the multi-target dashboard
        run: |
          python scripts/regenerate_dashboard.py --all-targets

      - name: Commit dashboard back to main
        run: |
          git config user.name  "agent-harness-bot"
          git config user.email "agent-harness@users.noreply.github.com"
          if git diff --quiet dashboard/; then
            echo "No dashboard changes to commit."
          else
            git add dashboard/
            git commit -m "batch: refresh dashboard from $(date -u +%Y-%m-%d) campaigns"
            git push
          fi

      # Pages deploy is intentionally DISABLED here for now: GitHub Pages isn't
      # enabled on the repo (Settings -> Pages -> Source = GitHub Actions), and
      # the default token can't enable it, so configure-pages 404s and fails the
      # batch. The dashboard is still regenerated and committed to main above, so
      # no data is lost. To re-enable publishing: flip that Settings toggle once,
      # then run the standalone `pages.yml` workflow (Actions -> pages -> Run
      # workflow) — it deploys dashboard/ from main on demand.

      - name: Upload batch summary as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-summary
          path: data/batch_summary.json
          if-no-files-found: ignore
          retention-days: 30
